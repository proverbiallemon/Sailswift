name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set Version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Sailswift/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Sailswift/Info.plist
          echo "Version set to: ${{ steps.version.outputs.version }} (${{ github.run_number }})"

      - name: Build Release
        run: |
          xcodebuild -project Sailswift.xcodeproj \
            -scheme Sailswift \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_CERT_P12" ]; then
            echo "DEVELOPER_ID_CERT_P12 secret is not set. Add the Developer ID Application certificate (base64 p12) before releasing."
            exit 1
          fi
          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security import cert.p12 -k build.keychain -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain build.keychain
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity found in the imported certificate."; exit 1; fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Sign with Developer ID and hardened runtime
        run: |
          APP_PATH="build/Build/Products/Release/Sailswift.app"
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          # Sparkle's nested executables first, then the framework, then the app.
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
            "$SPARKLE_FW/Versions/B/XPCServices/Installer.xpc" || true
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
            "$SPARKLE_FW/Versions/B/XPCServices/Downloader.xpc" || true
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
            "$SPARKLE_FW/Versions/B/Autoupdate" || true
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" \
            "$SPARKLE_FW/Versions/B/Updater.app" || true
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$SPARKLE_FW"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "Notarization secrets missing (APPLE_ID, APPLE_TEAM_ID, NOTARY_PASSWORD app-specific password)."
            exit 1
          fi
          cd build/Build/Products/Release
          ditto -c -k --keepParent Sailswift.app notarize-me.zip
          xcrun notarytool submit notarize-me.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARY_PASSWORD" \
            --wait --timeout 90m
          xcrun stapler staple Sailswift.app
          rm notarize-me.zip

      - name: Create ZIP Archive
        run: |
          cd build/Build/Products/Release
          zip -r -y ../../../../Sailswift-${{ steps.version.outputs.version }}.zip Sailswift.app

      - name: Create DMG
        run: |
          hdiutil create -volname "Sailswift" \
            -srcfolder build/Build/Products/Release/Sailswift.app \
            -ov -format UDZO \
            Sailswift-${{ steps.version.outputs.version }}.dmg

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit Sailswift-${{ steps.version.outputs.version }}.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARY_PASSWORD" \
            --wait --timeout 90m
          xcrun stapler staple Sailswift-${{ steps.version.outputs.version }}.dmg

      - name: Download Sparkle
        run: |
          curl -LO https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz
          tar -xf Sparkle-2.6.4.tar.xz
          ls -la bin/

      - name: Sign Update with EdDSA
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Write private key to temp file
          echo "$SPARKLE_PRIVATE_KEY" > sparkle_private_key.pem

          # Get file size
          FILE_SIZE=$(stat -f%z "Sailswift-${{ steps.version.outputs.version }}.zip")

          # Sign the update (tools extract to bin/ not Sparkle-2.6.4/bin/)
          # sign_update outputs: sparkle:edSignature="..." length="..."
          # Extract just the base64 signature value
          SIGN_OUTPUT=$(./bin/sign_update "Sailswift-${{ steps.version.outputs.version }}.zip" -f sparkle_private_key.pem)
          SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')

          # Clean up private key
          rm sparkle_private_key.pem

          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "Signature: $SIGNATURE"
          echo "File size: $FILE_SIZE"

      - name: Update Appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ github.run_number }}"
          SIGNATURE="${{ steps.sign.outputs.signature }}"
          FILE_SIZE="${{ steps.sign.outputs.file_size }}"
          DATE=$(date -R)
          DOWNLOAD_URL="https://github.com/proverbiallemon/Sailswift/releases/download/v${VERSION}/Sailswift-${VERSION}.zip"

          # Read release notes from file if it exists, otherwise use default
          if [ -f "RELEASE_NOTES.html" ]; then
            RELEASE_NOTES=$(cat RELEASE_NOTES.html)
          else
            RELEASE_NOTES="<p>See <a href=\"https://github.com/proverbiallemon/Sailswift/releases/tag/v${VERSION}\">release notes on GitHub</a> for details.</p>"
          fi

          # Create appcast using printf to avoid YAML/heredoc issues
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' > appcast.xml
          printf '%s\n' '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">' >> appcast.xml
          printf '%s\n' '    <channel>' >> appcast.xml
          printf '%s\n' '        <title>Sailswift Updates</title>' >> appcast.xml
          printf '%s\n' '        <link>https://github.com/proverbiallemon/Sailswift</link>' >> appcast.xml
          printf '%s\n' '        <description>Sailswift update feed</description>' >> appcast.xml
          printf '%s\n' '        <language>en</language>' >> appcast.xml
          printf '%s\n' '        <item>' >> appcast.xml
          printf '%s\n' "            <title>Version ${VERSION}</title>" >> appcast.xml
          printf '%s\n' "            <pubDate>${DATE}</pubDate>" >> appcast.xml
          printf '%s\n' "            <sparkle:version>${BUILD_NUMBER}</sparkle:version>" >> appcast.xml
          printf '%s\n' "            <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" >> appcast.xml
          printf '%s\n' '            <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>' >> appcast.xml
          printf '%s\n' '            <description><![CDATA[' >> appcast.xml
          printf '%s\n' "${RELEASE_NOTES}" >> appcast.xml
          printf '%s\n' '            ]]></description>' >> appcast.xml
          printf '%s\n' "            <enclosure url=\"${DOWNLOAD_URL}\"" >> appcast.xml
          printf '%s\n' "                       sparkle:edSignature=\"${SIGNATURE}\"" >> appcast.xml
          printf '%s\n' "                       length=\"${FILE_SIZE}\"" >> appcast.xml
          printf '%s\n' '                       type="application/octet-stream" />' >> appcast.xml
          printf '%s\n' '        </item>' >> appcast.xml
          printf '%s\n' '    </channel>' >> appcast.xml
          printf '%s\n' '</rss>' >> appcast.xml

          echo "Updated appcast.xml:"
          cat appcast.xml

      - name: Commit Appcast Update
        run: |
          # Save the generated appcast
          cp appcast.xml /tmp/appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f main

          # Restore the generated appcast
          cp /tmp/appcast.xml appcast.xml

          git add appcast.xml
          git commit -m "Update appcast for v${{ steps.version.outputs.version }}"
          git push origin main

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Sailswift v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            Sailswift-${{ steps.version.outputs.version }}.zip
            Sailswift-${{ steps.version.outputs.version }}.dmg
          body: |
            ## Sailswift v${{ steps.version.outputs.version }}

            ### Downloads
            - **DMG** (recommended): `Sailswift-${{ steps.version.outputs.version }}.dmg`
            - **ZIP**: `Sailswift-${{ steps.version.outputs.version }}.zip`

            ### Installation
            **DMG**: Open the disk image and drag Sailswift to your Applications folder.

            **ZIP**: Extract and drag `Sailswift.app` to your Applications folder.

            Releases are signed and notarized - no security warnings, no right-click dance.

            ### Auto-Update
            Sailswift automatically checks for updates. You can also check manually via **Sailswift → Check for Updates...**

            ### Homebrew
            ```
            brew trust --cask pocketbeardev/sailswift/sailswift
            brew install --cask pocketbeardev/sailswift/sailswift
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Homebrew Tap Update
        if: ${{ !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: PocketBearDev/homebrew-sailswift
          event-type: update-cask
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
        continue-on-error: true
